name: Dnevni izvjestaj javnih nabavki

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaliraj zavisnosti
        run: pip install -r requirements.txt

      - name: Dohvati nove/izmijenjene ugovore
        run: python fetch.py

      - name: Generisi HTML izvjestaje
        run: python report.py

      - name: Commituj promjene
        run: |
          git config user.name "nabavke-bot"
          git config user.email "nabavke-bot@users.noreply.github.com"
          git add data output
          git diff --cached --quiet || git commit -m "Dnevni update: $(date -u +%Y-%m-%d)"
          git push
